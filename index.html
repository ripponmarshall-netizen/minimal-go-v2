<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Go</title>
<style>
  :root {
    --bg: #F7F7F6;
    --surface: #EFEFEA;
    --text: #1C1C1E;
    --text-muted: #8E8E93;
    --accent: #2C4A46;
    --board: #DDC8A0;
    --black-stone: #111111;
    --white-stone: #FDFDFD;
    --border: #D1D1C6;
    --radius: 8px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  [data-theme="Ink"] {
    --bg: #FFFFFF; --surface: #F5F5F7; --text: #000000; --text-muted: #666666; --accent: #000000; --board: #FFFFFF; --border: #E5E5EA;
  }
  [data-theme="Monochrome"] {
    /* Pure OLED black for premium mobile displays */
    --bg: #000000; --surface: #1C1C1E; --text: #FFFFFF; --text-muted: #8E8E93; --accent: #FFFFFF; --board: #1C1C1E; --border: #38383A;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  
  body { 
    background-color: var(--bg); 
    color: var(--text); 
    display: flex; 
    justify-content: center; 
    min-height: 100vh; 
    overflow-x: hidden; 
    transition: background-color 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); 
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; 
    -webkit-font-smoothing: antialiased;
  }
  
  /* Layouts */
  .screen { 
    display: none; 
    width: 100%; 
    max-width: 500px; /* Narrower for premium feel */
    padding: calc(2rem + var(--safe-top)) 1.5rem calc(2rem + var(--safe-bottom)); 
    flex-direction: column; 
  }
  .screen.active { display: flex; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes fadeUp { 
    from { opacity: 0; transform: translateY(12px); } 
    to { opacity: 1; transform: translateY(0); } 
  }
  
  /* Typography & Elements */
  h1 { font-size: 2.75rem; font-weight: 400; letter-spacing: -0.04em; margin-bottom: 0.2rem; text-align: center; }
  p.subtitle { text-align: center; font-size: 0.95rem; font-weight: 400; color: var(--text-muted); margin-bottom: 3rem; letter-spacing: -0.01em; }
  
  .panel { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
  
  label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
  
  select, button { 
    width: 100%; 
    padding: 1rem; 
    background: var(--surface); 
    color: var(--text); 
    border: 1px solid transparent; 
    font-size: 1rem; 
    font-weight: 500;
    border-radius: var(--radius); 
    appearance: none; 
    outline: none; 
    cursor: pointer; 
    transition: all 0.2s ease; 
  }
  select { background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238E8E93' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 1rem center; padding-right: 2.5rem; }
  select:active { filter: brightness(0.95); }
  
  .checkbox-group { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; font-size: 0.95rem; font-weight: 400; color: var(--text); padding: 0.5rem 0; }
  .checkbox-group input { accent-color: var(--accent); width: 1.25rem; height: 1.25rem; border-radius: 4px; }
  
  button.primary { 
    background: var(--text); 
    color: var(--bg); 
    font-weight: 500; 
    font-size: 1.05rem; 
    padding: 1.1rem; 
    border-radius: var(--radius);
    margin-top: 1rem;
  }
  button.primary:active { transform: scale(0.98); opacity: 0.9; }
  
  .secondary-actions { display: flex; justify-content: center; gap: 2rem; margin-top: 1.5rem; }
  .secondary-actions button { background: none; border: none; width: auto; padding: 0.5rem; font-size: 0.85rem; color: var(--text-muted); text-decoration: none; font-weight: 400; }
  .secondary-actions button:active { color: var(--text); }
  
  .footer-note { text-align: center; font-size: 0.7rem; font-weight: 400; color: var(--text-muted); margin-top: auto; padding-top: 4rem; letter-spacing: 0.02em; }
  
  /* Game Screen */
  .game-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; padding: 0 0.5rem; }
  .status-block { display: flex; flex-direction: column; gap: 0.2rem; }
  .turn-indicator { font-size: 1.25rem; font-weight: 500; letter-spacing: -0.02em; }
  .match-info { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .captures { font-size: 0.85rem; font-weight: 500; text-align: right; color: var(--text-muted); line-height: 1.4; }
  
  .board-container { width: 100%; aspect-ratio: 1; background: var(--board); border-radius: 2px; position: relative; margin-bottom: 2rem; touch-action: manipulation; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 2px; }
  
  .action-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .action-bar button { font-size: 0.95rem; font-weight: 500; padding: 0.8rem; background: var(--surface); color: var(--text); border-radius: var(--radius); }
  .action-bar button:active { background: var(--border); transform: scale(0.98); }
  
  /* Utilities */
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="setup-screen" class="screen active">
  <h1>Go</h1>
  <p class="subtitle">A minimal board for focused play.</p>
  
  <div class="panel">
    <div class="form-group">
      <label>Game Mode</label>
      <select id="mode-select" onchange="toggleAIConfig()">
        <option value="local">Two Players</option>
        <option value="ai">Vs AI</option>
      </select>
    </div>
    
    <div id="ai-config" class="hidden">
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label>AI Difficulty</label>
        <select id="ai-level">
          <option value="1">Beginner</option>
          <option value="2">Casual</option>
          <option value="3">Balanced</option>
          <option value="4">Strong</option>
          <option value="5">Expert</option>
        </select>
      </div>
      <div class="form-group">
        <label>Play As</label>
        <select id="player-side">
          <option value="1">Black</option>
          <option value="2">White</option>
        </select>
      </div>
    </div>
    
    <div class="form-group">
      <label>Board Size</label>
      <select id="board-size">
        <option value="9">9x9</option>
        <option value="13">13x13</option>
        <option value="19">19x19</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Theme</label>
      <select id="theme-select" onchange="updateTheme()">
        <option value="Classic">Classic</option>
        <option value="Ink">Ink</option>
        <option value="Monochrome">Monochrome</option>
      </select>
    </div>

    <div class="form-group" style="margin-top: 0.5rem; gap: 0;">
      <label class="checkbox-group"><input type="checkbox" id="opt-coords"> Show coordinates</label>
      <label class="checkbox-group"><input type="checkbox" id="opt-marker" checked> Show last move marker</label>
      <label class="checkbox-group"><input type="checkbox" id="opt-restart"> Confirm restart</label>
    </div>
  </div>
  
  <button class="primary" onclick="startGame()">Start Game</button>
  <div class="secondary-actions">
    <button onclick="alert('Standard Go Rules Apply.\n\n• Capture stones by removing their liberties.\n• Suicide moves are prohibited.')">Rules</button>
    <button onclick="resetSettings()">Reset Settings</button>
  </div>
  
  <div class="footer-note">Created by Workflow Coaching and Optimisation Co.</div>
</div>

<div id="game-screen" class="screen">
  <div class="game-header">
    <div class="status-block">
      <div class="turn-indicator" id="turn-display">Black's Turn</div>
      <div class="match-info" id="match-display">Two Players · 9x9</div>
    </div>
    <div class="captures" id="capture-display">
      Black: 0 <br> White: 0
    </div>
  </div>
  
  <div class="board-container">
    <canvas id="go-board"></canvas>
  </div>
  
  <div class="action-bar">
    <button onclick="passTurn()">Pass</button>
    <button onclick="resign()">Resign</button>
    <button onclick="handleRestart()">Restart</button>
    <button onclick="backToSettings()">End Match</button>
  </div>
</div>

<script>
// Application State
const state = {
  mode: 'local', aiLevel: 1, playerSide: 1, size: 9, theme: 'Classic',
  opts: { coords: false, marker: true, confirmRestart: false },
  board: [], turn: 1, captures: { 1: 0, 2: 0 }, lastMove: null, passes: 0, gameOver: false
};

const canvas = document.getElementById('go-board');
const ctx = canvas.getContext('2d');
let cellSize, margin;

// UI Setup Logic
function toggleAIConfig() {
  const isAI = document.getElementById('mode-select').value === 'ai';
  document.getElementById('ai-config').classList.toggle('hidden', !isAI);
}

function updateTheme() {
  document.body.setAttribute('data-theme', document.getElementById('theme-select').value);
  // Update meta theme color for iOS status bar
  const themeColors = { 'Classic': '#F7F7F6', 'Ink': '#FFFFFF', 'Monochrome': '#000000' };
  let metaTheme = document.querySelector('meta[name="theme-color"]');
  if(!metaTheme) {
      metaTheme = document.createElement('meta');
      metaTheme.name = "theme-color";
      document.head.appendChild(metaTheme);
  }
  metaTheme.content = themeColors[document.getElementById('theme-select').value];
  if(state.board.length) drawBoard();
}

function resetSettings() {
  document.getElementById('mode-select').value = 'local';
  document.getElementById('board-size').value = '9';
  document.getElementById('theme-select').value = 'Classic';
  document.getElementById('ai-level').value = '1';
  document.getElementById('opt-coords').checked = false;
  document.getElementById('opt-marker').checked = true;
  document.getElementById('opt-restart').checked = false;
  toggleAIConfig(); updateTheme();
}

function startGame() {
  state.mode = document.getElementById('mode-select').value;
  state.aiLevel = parseInt(document.getElementById('ai-level').value);
  state.playerSide = parseInt(document.getElementById('player-side').value);
  state.size = parseInt(document.getElementById('board-size').value);
  state.opts.coords = document.getElementById('opt-coords').checked;
  state.opts.marker = document.getElementById('opt-marker').checked;
  state.opts.confirmRestart = document.getElementById('opt-restart').checked;
  
  initMatch();
  
  document.getElementById('setup-screen').classList.remove('active');
  document.getElementById('game-screen').classList.add('active');
  resizeCanvas();
  
  let matchText = state.mode === 'local' ? 'Two Players' : `Vs AI (Lvl ${state.aiLevel})`;
  document.getElementById('match-display').innerText = `${matchText} · ${state.size}x${state.size}`;
  
  if(state.mode === 'ai' && state.playerSide === 2) setTimeout(aiMove, 100);
}

function backToSettings() {
  document.getElementById('game-screen').classList.remove('active');
  document.getElementById('setup-screen').classList.add('active');
}

function handleRestart() {
  if (state.opts.confirmRestart && !confirm("Restart match?")) return;
  initMatch(); drawBoard();
  if(state.mode === 'ai' && state.playerSide === 2) setTimeout(aiMove, 100);
}

// Game Logic
function initMatch() {
  state.board = Array(state.size).fill().map(() => Array(state.size).fill(0));
  state.turn = 1; state.captures = {1:0, 2:0}; state.lastMove = null; state.passes = 0; state.gameOver = false;
  updateStatus();
}

function updateStatus() {
  document.getElementById('turn-display').innerText = state.gameOver ? "Match Ended" : (state.turn === 1 ? "Black's Turn" : "White's Turn");
  document.getElementById('capture-display').innerHTML = `Black: ${state.captures[1]} <br> White: ${state.captures[2]}`;
}

function passTurn() {
  if(state.gameOver) return;
  state.passes++;
  if(state.passes >= 2) { state.gameOver = true; updateStatus(); alert("Both players passed. Match ended."); return; }
  state.turn = state.turn === 1 ? 2 : 1;
  updateStatus();
  if(state.mode === 'ai' && state.turn !== state.playerSide) setTimeout(aiMove, 400);
}

function resign() {
  if(state.gameOver) return;
  state.gameOver = true;
  let winner = state.turn === 1 ? "White" : "Black";
  document.getElementById('turn-display').innerText = `${winner} Wins`;
}

// Rendering Logic
function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2; 
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  // Increase margin slightly for premium breathing room
  margin = rect.width / (state.size + 1.5); 
  cellSize = (rect.width - margin * 2) / (state.size - 1);
  drawBoard();
}

window.addEventListener('resize', () => { if(document.getElementById('game-screen').classList.contains('active')) resizeCanvas(); });

function drawBoard() {
  const styles = getComputedStyle(document.body);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.strokeStyle = styles.getPropertyValue('--border').trim();
  ctx.lineWidth = 1;
  
  // Crisp lines technique
  ctx.translate(0.5, 0.5); 
  
  ctx.beginPath();
  for(let i=0; i<state.size; i++) {
    ctx.moveTo(margin + i*cellSize, margin); ctx.lineTo(margin + i*cellSize, margin + (state.size-1)*cellSize);
    ctx.moveTo(margin, margin + i*cellSize); ctx.lineTo(margin + (state.size-1)*cellSize, margin + i*cellSize);
  }
  ctx.stroke();
  ctx.translate(-0.5, -0.5);
  
  // Star points
  const stars = state.size === 19 ? [[3,3],[9,3],[15,3],[3,9],[9,9],[15,9],[3,15],[9,15],[15,15]] :
                state.size === 13 ? [[3,3],[9,3],[6,6],[3,9],[9,9]] : [[2,2],[6,2],[4,4],[2,6],[6,6]];
  ctx.fillStyle = ctx.strokeStyle;
  stars.forEach(([x,y]) => { ctx.beginPath(); ctx.arc(margin + x*cellSize, margin + y*cellSize, 2.5, 0, Math.PI*2); ctx.fill(); });

  // Stones
  for(let y=0; y<state.size; y++) {
    for(let x=0; x<state.size; x++) {
      if(state.board[y][x] !== 0) drawStone(x, y, state.board[y][x]);
    }
  }

  // Last move marker (Refined)
  if(state.opts.marker && state.lastMove) {
    ctx.fillStyle = state.board[state.lastMove.y][state.lastMove.x] === 1 ? '#FFFFFF' : '#000000';
    ctx.beginPath();
    ctx.arc(margin + state.lastMove.x*cellSize, margin + state.lastMove.y*cellSize, cellSize*0.12, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawStone(x, y, color) {
  const styles = getComputedStyle(document.body);
  ctx.fillStyle = color === 1 ? styles.getPropertyValue('--black-stone').trim() : styles.getPropertyValue('--white-stone').trim();
  ctx.beginPath();
  ctx.arc(margin + x*cellSize, margin + y*cellSize, cellSize * 0.46, 0, Math.PI*2);
  ctx.fill();
  if(color === 2) {
    ctx.strokeStyle = styles.getPropertyValue('--border').trim();
    ctx.lineWidth = 1; ctx.stroke();
  }
}

// Interactions & Rules
canvas.addEventListener('click', (e) => {
  if(state.gameOver) return;
  if(state.mode === 'ai' && state.turn !== state.playerSide) return;
  
  const rect = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left - margin) / cellSize);
  const y = Math.round((e.clientY - rect.top - margin) / cellSize);
  
  if(x >= 0 && x < state.size && y >= 0 && y < state.size) attemptMove(x, y);
});

function getGroup(tx, ty, tBoard) {
  const color = tBoard[ty][tx];
  const visited = new Set();
  const group = [];
  const libs = new Set();
  const stack = [[tx, ty]];
  
  while(stack.length > 0) {
    const [cx, cy] = stack.pop();
    const key = `${cx},${cy}`;
    if(visited.has(key)) continue;
    visited.add(key);
    group.push([cx, cy]);
    
    [[0,1],[1,0],[0,-1],[-1,0]].forEach(([dx, dy]) => {
      const nx = cx+dx, ny = cy+dy;
      if(nx>=0 && nx<state.size && ny>=0 && ny<state.size) {
        if(tBoard[ny][nx] === 0) libs.add(`${nx},${ny}`);
        else if(tBoard[ny][nx] === color && !visited.has(`${nx},${ny}`)) stack.push([nx,ny]);
      }
    });
  }
  return {group, liberties: libs.size};
}

function attemptMove(x, y) {
  if(state.board[y][x] !== 0) return false;
  
  const tempBoard = state.board.map(row => [...row]);
  tempBoard[y][x] = state.turn;
  const oppColor = state.turn === 1 ? 2 : 1;
  let capturedStones = 0;
  
  [[0,1],[1,0],[0,-1],[-1,0]].forEach(([dx, dy]) => {
    const nx = x+dx, ny = y+dy;
    if(nx>=0 && nx<state.size && ny>=0 && ny<state.size && tempBoard[ny][nx] === oppColor) {
      const {group, liberties} = getGroup(nx, ny, tempBoard);
      if(liberties === 0) {
        group.forEach(([gx, gy]) => { tempBoard[gy][gx] = 0; capturedStones++; });
      }
    }
  });
  
  if(getGroup(x, y, tempBoard).liberties === 0) return false; 
  
  state.board = tempBoard;
  state.captures[state.turn] += capturedStones;
  state.lastMove = {x, y};
  state.passes = 0;
  state.turn = oppColor;
  
  drawBoard();
  updateStatus();
  
  if(state.mode === 'ai' && state.turn !== state.playerSide) setTimeout(aiMove, 300);
  return true;
}

// AI
function aiMove() {
  if(state.gameOver) return;
  const legalMoves = [];
  const oppColor = state.turn === 1 ? 2 : 1;
  
  for(let y=0; y<state.size; y++) {
    for(let x=0; x<state.size; x++) {
      if(state.board[y][x] === 0) {
        const tempBoard = state.board.map(r => [...r]);
        tempBoard[y][x] = state.turn;
        if(getGroup(x, y, tempBoard).liberties > 0) legalMoves.push({x, y});
      }
    }
  }
  if(!legalMoves.length) { passTurn(); return; }

  let bestMove = legalMoves[Math.floor(Math.random() * legalMoves.length)];
  
  if(state.aiLevel > 1) {
    let bestScore = -Infinity;
    legalMoves.forEach(move => {
      let score = Math.random(); 
      const tb = state.board.map(r => [...r]);
      tb[move.y][move.x] = state.turn;
      
      if(state.aiLevel >= 2) {
         [[0,1],[1,0],[0,-1],[-1,0]].forEach(([dx, dy]) => {
          const nx = move.x+dx, ny = move.y+dy;
          if(nx>=0 && nx<state.size && ny>=0 && ny<state.size && state.board[ny][nx] === oppColor) {
            if(getGroup(nx, ny, state.board).liberties === 1) score += 100;
          }
        });
      }
      if(state.aiLevel >= 3) {
         [[0,1],[1,0],[0,-1],[-1,0]].forEach(([dx, dy]) => {
          const nx = move.x+dx, ny = move.y+dy;
          if(nx>=0 && nx<state.size && ny>=0 && ny<state.size && state.board[ny][nx] === state.turn) {
            if(getGroup(nx, ny, state.board).liberties === 1 && getGroup(move.x, move.y, tb).liberties > 1) score += 50; 
          }
        });
      }
      if(state.aiLevel >= 4) {
        const libs = getGroup(move.x, move.y, tb).liberties;
        score += libs;
        if(state.aiLevel === 5) {
          const distToCenter = Math.abs(move.x - state.size/2) + Math.abs(move.y - state.size/2);
          score -= distToCenter * 0.1;
        }
      }
      
      if(score > bestScore) { bestScore = score; bestMove = move; }
    });
  }
  
  attemptMove(bestMove.x, bestMove.y);
}

// Initial theme setup
updateTheme();
</script>
</body>
</html>
